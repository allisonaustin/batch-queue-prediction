# Feature columns (names from XMATCH_COLS, schema_meta.json) used for the DR
# embedding and the feature-importance panel in vis/app.py. Comment out (or
# remove) a line to drop that feature; add one back by uncommenting.
#
# Deliberately excludes the raw categorical code columns (Group, Owner,
# CampaignId, MatchSite, ...) -- those are arbitrary integer codes, and
# averaging them per entity for DR/correlation is meaningless. Path override:
# env var FIFE_VIS_FEATURES.

features:
  # categorical
  # - 'Group'
  # - 'Owner'
  # - 'PomsLauncher'
  # - 'CampaignName'
  # - 'CampaignStageName'
  # - 'CampaignId'
  # - 'CampaignStageId'
  # - 'CampaignType'
  # - 'TestLaunch'
  # - 'JobsubGroup'
  # - 'Image'
  # - 'BlacklistSites'
  # - 'MatchSite'
  # - 'MatchEntry'
  # - 'MatchQueue'
  # - 'MatchResource'
  # - 'MatchCpus'

  # numeric 
  - 'RequestCpus (std)'
  - 'RequestDisk (std)'
  - 'RequestMemory (std)'
  - 'RequestSlots (std)'
  - 'ExecutableSize (std)'
  - 'TransferInputMB (std)'
  - 'ExpectedLifetime (std)'
  - 'TotalSubmitProcs (std)'
  - 'CpusProvisioned (std)'
  - 'DiskProvisioned (std)'
  - 'MemoryProvisioned (std)'

  # cyclical submission/match-time clock
  # - sin_hour@match
  # - cos_hour@match
  # - sin_wday@match
  # - cos_wday@match

  # leak-free trailing failure/hardware-fault rates (15m + 60m windows)
  # - trail15m_site_fail
  # - trail15m_entry_fail
  # - trail15m_node_fail
  # - trail15m_site_hw
  # - trail15m_node_hw
  # - trail15m_camp_fail
  # - trail60m_site_fail
  # - trail60m_entry_fail
  # - trail60m_node_fail
  # - trail60m_site_hw
  # - trail60m_node_hw
  # - trail60m_camp_fail

  # concurrency
  # - log_site_running@match
  # - log_total_running@match
